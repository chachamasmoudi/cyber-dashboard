# Configuration JNDI : les noms utilisés dans le code (lookup) sont définis ici.
java.naming.factory.initial = org.apache.activemq.jndi.ActiveMQInitialContextFactory
java.naming.provider.url = tcp://localhost:61616

# Nom JNDI de la connection factory
connectionFactoryNames = ConnectionFactory

# Topic des alertes : topic.<nom JNDI> = <nom réel dans le broker>
topic.alertes = alertes